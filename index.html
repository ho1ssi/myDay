<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f6f6"><link rel="apple-touch-icon" href="./icon-180.png"><link rel="icon" type="image/png" href="./icon-192.png"><link rel="manifest" href="./manifest.json"><title>오르빗 · Orbit</title><link rel="stylesheet" href="./style.css"></head>
<body><header><button id="calendar-open" aria-label="월간 캘린더"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 10h18"/><path d="M7 14h2M11 14h2M15 14h2M7 17h2M11 17h2"/></svg></button><div class="date-nav"><button id="previous" aria-label="이전 날짜">‹</button><button id="date-label"></button><input id="date" type="date" aria-label="날짜 선택"><button id="next" aria-label="다음 날짜">›</button></div><div class="header-actions"><button id="today">오늘</button></div></header><nav class="view-tabs" aria-label="화면 보기"><button id="view-both" class="selected" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M11 4v16"/></svg>전체</button><button id="view-timeline" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>시간표</button><button id="view-tasks" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3 7 2 2 3-4M11 7h10M3 14h5M11 14h10M3 20h5M11 20h10"/></svg>할 일</button></nav>
<main><section class="plan" aria-label="하루 시간표"><div class="plan-title">시간표<button id="add-event" aria-label="일정 추가">＋</button></div><div class="ruler"><div></div><div class="minute-labels"><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>60</span></div></div><div id="timeline"></div></section><section class="study"><div class="tasks-heading"><div class="task-period" aria-label="할 일 보기 기간"><button type="button" id="period-day" aria-pressed="true">일간</button><button type="button" id="period-week" aria-pressed="false">주간</button></div><span>할 일</span><button id="new-group" aria-label="할 일 추가">＋ 추가</button></div><div id="week-overview" hidden><div id="week-days"></div><div id="week-selected-date"></div></div><div class="task-scroll"><div id="groups"></div><button class="add-group" id="group-add">＋ 카테고리 추가</button></div></section>
</main>
<dialog id="editor"><form id="form" novalidate><div class="dialog-head"><h2 id="editor-title">할 일 추가</h2><button type="button" id="cancel" aria-label="닫기">×</button></div><label>할 일<input id="task" required maxlength="100"></label><fieldset class="category-field"><legend>카테고리</legend><div id="category-picks"></div><input id="category" type="hidden"></fieldset><label class="inline"><input type="checkbox" id="scheduled"> 시간 설정</label><div class="time-fields"><label>시작<input type="time" id="start" value="15:00"></label><label>종료 (선택)<input type="time" id="end"></label></div><div id="start-picker"><p class="picker-title">시작시간</p><div id="period-picks" class="picker-row"></div><div id="hour-picks" class="picker-row hour-picks"></div><div id="minute-picks" class="picker-row"></div><p id="picker-hint"></p></div><div id="time-tools"><div class="time-target"><span>종료시간</span><span id="duration"></span></div><div class="time-increments"><button type="button" data-minutes="1">+1분</button><button type="button" data-minutes="5">+5분</button><button type="button" data-minutes="30">+30분</button><button type="button" data-minutes="60">+1시간</button></div><div class="time-increments time-decrements"><button type="button" data-minutes="-1">−1분</button><button type="button" data-minutes="-5">−5분</button><button type="button" data-minutes="-30">−30분</button><button type="button" data-minutes="-60">−1시간</button></div></div><label>메모<textarea id="memo" rows="1"></textarea></label><fieldset class="color-field"><legend>색상</legend><div id="color-picks"></div><input id="color" type="hidden" value="blue"></fieldset><label class="inline"><input type="checkbox" id="done"> 완료</label><p id="error" role="alert"></p><button class="save" type="submit">저장</button><button id="delete" class="delete" type="button">삭제</button></form></dialog>
<dialog id="group-editor"><form id="group-form" novalidate><div class="dialog-head"><h2 id="group-title">카테고리 추가</h2><button type="button" id="group-cancel" aria-label="닫기">×</button></div><label>카테고리 이름<input id="group-name" autofocus required maxlength="30"></label><p id="group-error" class="field-error" role="alert"></p><fieldset class="color-field"><legend>색상</legend><div id="group-color-picks"></div><input id="group-color" type="hidden" value="blue"></fieldset><button class="save" id="group-save">추가</button><button type="button" class="delete" id="group-delete" hidden>카테고리 삭제</button></form></dialog><dialog id="calendar-dialog"><div class="dialog-head"><h2>캘린더</h2><button id="calendar-close" aria-label="캘린더 닫기">×</button></div><div class="calendar-nav"><button id="month-prev" aria-label="이전 달">‹</button><strong id="calendar-month"></strong><button id="month-next" aria-label="다음 달">›</button></div><div class="calendar-week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar-days"></div></dialog><p id="status" role="status"></p><dialog id="color-spectrum" aria-labelledby="spectrum-title"><div class="dialog-head"><h2 id="spectrum-title">색상 선택</h2><button type="button" id="spectrum-cancel" aria-label="색상 선택 취소">×</button></div><div id="spectrum-square" aria-label="색상 스펙트럼"><i id="spectrum-cursor"></i></div><label class="spectrum-hue-label">색조<input id="spectrum-hue" type="range" min="0" max="359" value="0"></label><div class="spectrum-value"><span id="spectrum-preview"></span><label>색상 코드<input id="spectrum-hex" maxlength="7" value="#ffffff" spellcheck="false"></label></div><button type="button" class="save" id="spectrum-apply">적용</button></dialog><script src="./app.js"></script></body></html>
