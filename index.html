<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f5"><link rel="manifest" href="./manifest.json"><title>myDay</title><style>
:root{--bg:#f7f7f5;--ink:#242522;--line:#e8e9e6;--muted:#858780}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;padding-bottom:85px}.top{position:sticky;top:0;z-index:5;background:#f7f7f5f5;backdrop-filter:blur(12px);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}.head{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:750}.muted{font-size:12px;color:var(--muted);margin-top:3px}button{font:inherit;cursor:pointer}.btn{border:1px solid #dedfdb;background:white;border-radius:10px;padding:8px 11px;font-size:13px}.month{display:flex;justify-content:space-between;align-items:center;margin-top:15px;font-weight:700}.arrows{display:flex;gap:6px}.arrows button{width:34px;height:32px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:18px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}.day{border:0;background:none;border-radius:11px;padding:6px 0;color:#777;font-size:11px}.day strong{display:block;font-size:15px;color:#333;margin-top:4px}.day.sel{background:#242522;color:white}.day.sel strong{color:white}.day.today:not(.sel) strong{background:#e8c94f;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;margin:3px auto 0}.stats{display:flex;gap:14px;padding:13px 16px 11px;color:#777;font-size:12px}.stats b{color:#30312e;font-size:13px}.stats span:last-child{margin-left:auto}.grid{margin:0 12px;background:white;border:1px solid #e4e5e1;border-radius:13px;overflow:hidden}.ruler,.hour{display:grid;grid-template-columns:42px minmax(0,1fr)}.ruler{position:sticky;top:143px;z-index:4;background:#fff;border-bottom:1px solid var(--line)}.ruler>div:first-child{border-right:1px solid var(--line)}.minutes{height:29px;display:grid;grid-template-columns:repeat(7,1fr);align-items:center;text-align:center;color:#92958f;font-size:10px}.hour{min-height:52px;border-bottom:1px solid var(--line)}.hour:last-child{border-bottom:0}.label{font-size:12px;color:#70736e;text-align:center;padding-top:5px;border-right:1px solid var(--line)}.label.now{font-weight:700}.label.now span{display:inline-flex;width:27px;height:27px;border-radius:50%;background:#e8c94f;align-items:center;justify-content:center;margin-top:-3px}.cells{position:relative;min-width:0}.vline{position:absolute;top:0;bottom:0;width:1px;background:#f0f1ee;pointer-events:none}.event{position:absolute;z-index:2;top:5px;height:41px;border:0;border-radius:4px;padding:5px 6px;overflow:hidden;text-align:left;color:#344247;font-size:12px;line-height:1.2;min-width:7px}.event strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}.event small{display:block;font-size:10px;margin-top:3px;opacity:.75;white-space:nowrap}.blue{background:#ccebf1}.green{background:#dcebd6}.pink{background:#f2d9df}.purple{background:#e2def5}.orange{background:#f6e2c7}.done{opacity:.55}.done strong{text-decoration:line-through}.bottom{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#f7f7f5f5;backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:10}.bottomin{max-width:760px;margin:auto;display:flex;gap:9px}.add{flex:1;background:#242522;color:#fff;border:0;border-radius:12px;padding:13px;font-size:14px;font-weight:650}.todaybtn{border:1px solid #dedfdb;background:#fff;border-radius:12px;padding:0 15px}.overlay{position:fixed;inset:0;z-index:20;background:#14151359;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{width:100%;max-width:600px;background:white;border-radius:20px 20px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.grab{width:35px;height:4px;background:#dedfdb;border-radius:5px;margin:0 auto 17px}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.sheethead h2{font-size:18px;margin:0}.close{border:0;border-radius:50%;width:30px;height:30px;background:#f2f3f0;font-size:18px}.field{margin:13px 0}.field label{display:block;font-size:12px;color:#777;margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid #e0e1dd;border-radius:10px;padding:12px;font-size:15px;background:white}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.colors{display:flex;gap:9px}.pick{width:30px;height:30px;border:2px solid white;border-radius:8px;outline:1px solid transparent}.pick.active{outline-color:#444}.save{width:100%;border:0;background:#242522;color:white;border-radius:12px;padding:14px;margin-top:8px;font-weight:650}.delete{width:100%;border:0;background:none;color:#a34b4b;padding:12px}.listitem{display:flex;width:100%;gap:12px;align-items:center;text-align:left;background:white;border:1px solid #e6e7e3;border-radius:11px;padding:13px;margin-bottom:8px;color:#242522}
</style></head><body><div class="top"><div class="head"><div><div class="brand">myDay</div><div class="muted">하루를 시간으로 정리하기</div></div><button class="btn" id="view">목록 보기</button></div><div class="month"><span id="month"></span><div class="arrows"><button id="prev">‹</button><button id="next">›</button></div></div><div class="week" id="week"></div></div><div class="stats"><span>계획 <b id="planned">0시간</b></span><span>완료 <b id="completed">0개</b></span><span id="short"></span></div><div class="grid" id="grid"><div class="ruler"><div></div><div class="minutes"><span>0</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>60</span></div></div><div id="timeline"></div></div><div id="list" style="display:none;padding:0 14px"></div></div><div class="bottom"><div class="bottomin"><button class="todaybtn" id="today">오늘</button><button class="add" id="add">＋ 일정 추가</button></div></div><div class="overlay" id="overlay"><div class="sheet"><div class="grab"></div><div class="sheethead"><h2 id="formtitle">일정 추가</h2><button class="close" id="close">×</button></div><div class="field"><label>일정 이름</label><input id="task" maxlength="70" placeholder="예: 영어 단어 암기"></div><div class="two"><div class="field"><label>시작</label><input id="start" type="time" value="15:00"></div><div class="field"><label>종료</label><input id="end" type="time" value="16:00"></div></div><div class="field"><label>메모 (선택)</label><textarea id="memo" rows="2" placeholder="필요한 내용만 간단히"></textarea></div><div class="field"><label>색상</label><div class="colors"><button class="pick blue active" data-color="blue"></button><button class="pick green" data-color="green"></button><button class="pick pink" data-color="pink"></button><button class="pick purple" data-color="purple"></button><button class="pick orange" data-color="orange"></button></div></div><button class="save" id="save">저장</button><button class="delete" id="delete" style="display:none">일정 삭제</button></div></div><script>
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,mins=t=>{let[h,m]=t.split(':').map(Number);return h*60+m},ts=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;let selected=new Date();selected.setHours(0,0,0,0);let data={};try{data=JSON.parse(localStorage.getItem('myday-v1')||'{}')||{}}catch(e){}let editing=null,color='blue',mode='grid';const items=()=>data[key(selected)]||[],ensure=()=>data[key(selected)]||(data[key(selected)]=[]),persist=()=>localStorage.setItem('myday-v1',JSON.stringify(data));function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let wd=['일','월','화','수','목','금','토'],today=new Date();today.setHours(0,0,0,0);$('month').textContent=`${selected.getFullYear()}년 ${selected.getMonth()+1}월`;$('short').textContent=`${selected.getMonth()+1}.${selected.getDate()}`;let mon=new Date(selected);mon.setDate(mon.getDate()-(mon.getDay()+6)%7);$('week').innerHTML='';for(let i=0;i<7;i++){let d=new Date(mon);d.setDate(mon.getDate()+i);let b=document.createElement('button');b.className='day'+(key(d)===key(selected)?' sel':'')+(key(d)===key(today)?' today':'');b.innerHTML=`${wd[d.getDay()]}<strong>${d.getDate()}</strong>`;b.onclick=()=>{selected=d;render()};$('week').append(b)}let list=items().slice().sort((a,b)=>mins(a.start)-mins(b.start)),total=list.reduce((n,x)=>n+Math.max(0,mins(x.end)-mins(x.start)),0);$('planned').textContent=`${Math.floor(total/60)}시간${total%60?' '+total%60+'분':''}`;$('completed').textContent=list.filter(x=>x.done).length+'개';$('grid').style.display=mode==='grid'?'block':'none';$('list').style.display=mode==='list'?'block':'none';$('view').textContent=mode==='grid'?'목록 보기':'시간표 보기';if(mode==='list'){let l=$('list');l.innerHTML='';list.forEach(ev=>{let b=document.createElement('button');b.className='listitem';b.innerHTML=`<span style="width:4px;align-self:stretch;border-radius:5px;background:${({blue:'#a9dce5',green:'#bcd8b2',pink:'#e5bac5',purple:'#c8c0eb',orange:'#eac18b'})[ev.color]||'#a9dce5'}"></span><span style="flex:1"><b>${esc(ev.task)}</b><small style="display:block;color:#858780;margin-top:5px">${ev.start} – ${ev.end}${ev.memo?' · '+esc(ev.memo):''}</small></span><small>${ev.done?'완료':'수정'}</small>`;b.onclick=()=>open(ev.id);l.append(b)});if(!list.length)l.innerHTML='<div style="text-align:center;padding:22px;color:#999;font-size:12px">아직 등록한 일정이 없어.</div>';return}
let tl=$('timeline');tl.innerHTML='';let now=new Date(),isToday=key(now)===key(selected);for(let h=6;h<29;h++){let row=document.createElement('div');row.className='hour';let lab=document.createElement('div');lab.className='label'+(isToday&&h===now.getHours()?' now':'');lab.innerHTML=isToday&&h===now.getHours()?`<span>${h%24}</span>`:`${h%24}`;let cells=document.createElement('div');cells.className='cells';for(let j=1;j<=5;j++){let line=document.createElement('i');line.className='vline';line.style.left=(j/6*100)+'%';cells.append(line)}let hit=document.createElement('div');hit.style.cssText='position:absolute;inset:0;z-index:1';hit.onclick=e=>{let r=cells.getBoundingClientRect(),m=Math.max(0,Math.min(50,Math.round((e.clientX-r.left)/r.width*6)*10));open(null,h*60+m)};cells.append(hit);list.forEach(ev=>{let s=mins(ev.start),en=mins(ev.end),rs=h*60,re=rs+60;if(en<=rs||s>=re)return;let a=Math.max(s,rs),b=Math.min(en,re),el=document.createElement('button');el.className=`event ${ev.color||'blue'}${ev.done?' done':''}`;el.style.left=((a-rs)/60*100)+'%';el.style.width=(Math.max((b-a)/60*100,8))+'%';let first=s>=rs&&s<re,last=en>rs&&en<=re;el.innerHTML=`<strong>${esc(ev.task)}</strong>${first?`<small>${ts(s)}${last?' – '+ts(en):' →'}</small>`:''}`;el.onclick=e=>{e.stopPropagation();open(ev.id)};cells.append(el)});row.append(lab,cells);tl.append(row)}}
function open(id=null,minute=null){editing=id;let ev=id?items().find(x=>x.id===id):null,s=ev?mins(ev.start):(minute??900);$('formtitle').textContent=ev?'일정 수정':'일정 추가';$('task').value=ev?.task||'';$('start').value=ts(s);$('end').value=ev?.end:ts(Math.min(s+60,1739));$('memo').value=ev?.memo||'';color=ev?.color||'blue';document.querySelectorAll('.pick').forEach(b=>b.classList.toggle('active',b.dataset.color===color));$('delete').style.display=ev?'block':'none';$('overlay').classList.add('show')}
function close(){ $('overlay').classList.remove('show');editing=null}
$('prev').onclick=()=>{selected.setDate(selected.getDate()-1);render()};$('next').onclick=()=>{selected.setDate(selected.getDate()+1);render()};$('today').onclick=()=>{selected=new Date();selected.setHours(0,0,0,0);render()};$('add').onclick=()=>open();$('view').onclick=()=>{mode=mode==='grid'?'list':'grid';render()};$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};$('save').onclick=()=>{let task=$('task').value.trim(),start=$('start').value,end=$('end').value;if(!task){$('task').focus();return}if(!start||!end||mins(end)<=mins(start)){alert('종료 시간은 시작 시간보다 늦게 설정해 줘.');return}let a=ensure();if(editing){let ev=a.find(x=>x.id===editing);if(ev)Object.assign(ev,{task,start,end,memo:$('memo').value.trim(),color})}else a.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),task,start,end,memo:$('memo').value.trim(),color,done:false});persist();close();render()};$('delete').onclick=()=>{if(editing){data[key(selected)]=items().filter(x=>x.id!==editing);persist();close();render()}};document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{color=b.dataset.color;document.querySelectorAll('.pick').forEach(x=>x.classList.toggle('active',x===b))});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
