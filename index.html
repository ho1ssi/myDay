<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Day">
<link rel="manifest" href="manifest.json">
<title>My Day</title>
<style>
:root{
 --bg:#fff;--ink:#171717;--sub:#777;--line:#e9e9e9;--line2:#f3f3f3;
 --accent:#222;--blue:#e9f0ff;--blue-ink:#315da8;
 --green:#eaf5ee;--green-ink:#39724d;--orange:#fff2e5;--orange-ink:#9b5d20;
 --purple:#f1ecfa;--purple-ink:#6b4ca0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit}
button{border:0;background:none;color:inherit}
.app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom))}
.header{padding:18px 18px 10px;display:flex;justify-content:space-between;align-items:flex-start}
.brand{font-size:13px;font-weight:700;letter-spacing:.08em;color:#999}.date-title{font-size:25px;font-weight:750;letter-spacing:-.7px;margin-top:5px}
.header-actions{display:flex;gap:6px}.iconbtn{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;font-size:17px;background:#fff}
.week{display:flex;gap:4px;padding:8px 14px 14px;overflow-x:auto;scrollbar-width:none}.week::-webkit-scrollbar{display:none}
.day{min-width:47px;height:55px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#888}
.day .dow{font-size:10px}.day .num{font-size:16px;font-weight:650;color:#444}.day.selected{background:#171717;color:#fff}.day.selected .num{color:#fff}.day.today:not(.selected) .num{text-decoration:underline;text-underline-offset:4px}
.toolbar{display:flex;justify-content:space-between;align-items:center;padding:0 18px 12px;border-bottom:1px solid var(--line)}
.segment{display:flex;background:#f5f5f5;padding:3px;border-radius:9px}.seg{font-size:12px;padding:7px 12px;border-radius:7px;color:#777}.seg.on{background:#fff;color:#111;box-shadow:0 1px 3px #00000012}
.summary{font-size:12px;color:#777}.summary b{color:#222}
.grid-wrap{position:relative;overflow:auto;height:calc(100vh - 220px);min-height:520px;-webkit-overflow-scrolling:touch}
.grid{position:relative;display:grid;grid-template-columns:54px 1fr;min-width:340px;width:100%}
.times{position:relative;background:#fff;z-index:3}.time{height:48px;border-bottom:1px solid var(--line2);font-size:10px;color:#999;text-align:right;padding:5px 9px 0 0}
.lane{position:relative;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 23px,var(--line2) 24px,transparent 25px);border-left:1px solid var(--line);background-size:100% 48px}
.hourline{position:absolute;left:0;right:0;border-top:1px solid var(--line);height:1px}
.event{position:absolute;left:7px;right:7px;border-radius:8px;padding:7px 8px;overflow:hidden;border-left:3px solid #222;background:#f1f1f1;z-index:2;box-shadow:0 1px 2px #00000008}
.event.blue{background:var(--blue);border-left-color:#5c83c7}.event.green{background:var(--green);border-left-color:#5a9a70}.event.orange{background:var(--orange);border-left-color:#d48a43}.event.purple{background:var(--purple);border-left-color:#8664bd}
.event.done{opacity:.45}.event-title{font-size:12px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-time{font-size:10px;color:#777;margin-top:3px}.nowline{position:absolute;left:0;right:0;border-top:2px solid #111;z-index:4;pointer-events:none}.nowdot{position:absolute;left:-5px;top:-5px;width:8px;height:8px;background:#111;border-radius:50%}
.list{padding:14px 16px}.list-item{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.list-time{font-size:11px;color:#888;padding-top:2px}.list-card{display:flex;gap:10px;align-items:flex-start}.check{width:21px;height:21px;border:1px solid #bbb;border-radius:6px;flex:none;margin-top:1px;display:grid;place-items:center}.done .check{background:#222;border-color:#222;color:#fff}.check:after{content:"✓";display:none;font-size:13px}.done .check:after{display:block}.list-title{font-size:14px;font-weight:650}.list-sub{font-size:11px;color:#888;margin-top:4px}.empty{text-align:center;color:#999;padding:70px 20px;font-size:13px}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:14px;background:#171717;color:#fff;font-size:26px;box-shadow:0 5px 16px #0002;z-index:6}
.sheet{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;z-index:20}.sheet.show{display:flex}
.panel{width:100%;max-width:760px;margin:auto;background:#fff;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheet-head h2{font-size:18px;margin:0}.close{font-size:24px;color:#888;padding:4px}
.field{margin:11px 0}.label{font-size:11px;color:#888;margin-bottom:6px;display:block}.input,.textarea{width:100%;border:1px solid #ddd;border-radius:9px;background:#fff;padding:11px;outline:none}.input:focus,.textarea:focus{border-color:#222}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.colors{display:flex;gap:7px}.color{width:30px;height:30px;border-radius:8px;border:2px solid transparent}.color.selected{border-color:#111}.c0{background:#f1f1f1}.c1{background:var(--blue)}.c2{background:var(--green)}.c3{background:var(--orange)}.c4{background:var(--purple)}
.save{width:100%;background:#171717;color:#fff;border-radius:9px;padding:12px;font-weight:650;margin-top:5px}.delete{width:100%;color:#a44b42;padding:11px;display:none}
.install{margin:10px 16px;padding:10px 12px;background:#f6f6f6;border-radius:9px;color:#666;font-size:11px}
@media(min-width:600px){.grid-wrap{height:calc(100vh - 215px)}}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div><div class="brand">MY DAY</div><div id="dateTitle" class="date-title"></div></div>
  <div class="header-actions"><button class="iconbtn" onclick="goToday()">오늘</button></div>
</header>
<div id="week" class="week"></div>
<div class="toolbar">
  <div class="segment"><button id="segGrid" class="seg on" onclick="setView('grid')">시간표</button><button id="segList" class="seg" onclick="setView('list')">목록</button></div>
  <div id="summary" class="summary"></div>
</div>
<div id="content"></div>
</div>
<button class="fab" onclick="openAdd()">＋</button>

<div id="sheet" class="sheet" onclick="if(event.target===this)closeSheet()">
 <div class="panel">
  <div class="sheet-head"><h2 id="formTitle">일정 추가</h2><button class="close" onclick="closeSheet()">×</button></div>
  <input id="editId" type="hidden">
  <div class="field"><label class="label">일정</label><input id="task" class="input" placeholder="예: 토익스피킹 공부"></div>
  <div class="row2">
   <div class="field"><label class="label">시작</label><input id="start" class="input" type="time"></div>
   <div class="field"><label class="label">종료</label><input id="end" class="input" type="time"></div>
  </div>
  <div class="field"><label class="label">색상</label><div class="colors">
    <button class="color c0 selected" data-color="c0" onclick="chooseColor(this)"></button>
    <button class="color c1" data-color="c1" onclick="chooseColor(this)"></button>
    <button class="color c2" data-color="c2" onclick="chooseColor(this)"></button>
    <button class="color c3" data-color="c3" onclick="chooseColor(this)"></button>
    <button class="color c4" data-color="c4" onclick="chooseColor(this)"></button>
  </div></div>
  <div class="field"><label class="label">메모</label><textarea id="memo" class="textarea" rows="2" placeholder="선택"></textarea></div>
  <button class="save" onclick="saveItem()">저장</button>
  <button id="deleteBtn" class="delete" onclick="deleteEditing()">일정 삭제</button>
 </div>
</div>

<script>
const KEY="myday-v1", START_H=6, END_H=24, SLOT=48;
let selected=new Date();selected.setHours(0,0,0,0);
let data=JSON.parse(localStorage.getItem(KEY)||"{}"), view="grid", chosenColor="c0";
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const mins=t=>{let [h,m]=t.split(":").map(Number);return h*60+m};
const fmt=t=>t.replace(":00","");
function items(){return data[dateKey(selected)]||[]}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function dateText(d){return d.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"})}
function render(){
 $("dateTitle").textContent=dateText(selected);
 renderWeek();
 let arr=items().sort((a,b)=>mins(a.start)-mins(b.start));
 let total=arr.reduce((s,x)=>s+Math.max(0,mins(x.end)-mins(x.start)),0);
 let done=arr.filter(x=>x.done).reduce((s,x)=>s+Math.max(0,mins(x.end)-mins(x.start)),0);
 $("summary").innerHTML=`<b>${arr.length}</b>개 · ${Math.floor(total/60)}시간${total%60?` ${total%60}분`:""} · 완료 ${done?Math.floor(done/60)+"시간"+(done%60?" "+done%60+"분":""):"0분"}`;
 $("segGrid").classList.toggle("on",view==="grid");$("segList").classList.toggle("on",view==="list");
 $("content").innerHTML=view==="grid"?gridView(arr):listView(arr);
}
function renderWeek(){
 let out="", d=new Date(selected);d.setDate(d.getDate()-3);
 for(let i=0;i<7;i++){let x=new Date(d);x.setDate(d.getDate()+i);let sel=dateKey(x)===dateKey(selected),today=dateKey(x)===dateKey(new Date());out+=`<button class="day ${sel?"selected ":""}${today?"today":""}" onclick="pickDate('${dateKey(x)}')"><span class="dow">${x.toLocaleDateString("ko-KR",{weekday:"short"}).replace("요일","")}</span><span class="num">${x.getDate()}</span></button>`}
 $("week").innerHTML=out;
}
function pickDate(k){let [y,m,d]=k.split("-").map(Number);selected=new Date(y,m-1,d);render()}
function gridView(arr){
 let times="",lines="",events="";
 for(let h=START_H;h<=END_H;h++){if(h<END_H)times+=`<div class="time">${pad(h)}:00</div>`;if(h<END_H)lines+=`<div class="hourline" style="top:${(h-START_H)*SLOT}px"></div>`}
 for(const x of arr){let top=(mins(x.start)-START_H*60)/60*SLOT;let height=Math.max(26,(mins(x.end)-mins(x.start))/60*SLOT);events+=`<button class="event ${x.color||"c0"} ${x.done?"done":""}" style="top:${top}px;height:${height}px" onclick="edit('${x.id}')"><div class="event-title">${esc(x.task)}</div><div class="event-time">${x.start}–${x.end}</div></button>`}
 let now="";if(dateKey(selected)===dateKey(new Date())){let d=new Date(),m=d.getHours()*60+d.getMinutes();if(m>=START_H*60&&m<END_H*60)now=`<div class="nowline" style="top:${(m-START_H*60)/60*SLOT}px"><span class="nowdot"></span></div>`}
 let rows="";for(let h=START_H;h<END_H;h++)rows+=`<div class="time">${pad(h)}:00</div>`;
 return `<div class="grid-wrap" id="gridWrap"><div class="grid"><div class="times">${rows}</div><div class="lane" style="height:${(END_H-START_H)*SLOT}px" onclick="quickAdd(event,this)">${lines}${events}${now}</div></div></div>`;
}
function listView(arr){
 if(!arr.length)return `<div class="empty">등록된 일정이 없습니다.</div>`;
 return `<div class="list">${arr.map(x=>`<div class="list-item ${x.done?"done":""}"><div class="list-time">${x.start}<br>${x.end}</div><div class="list-card"><button class="check" onclick="toggle('${x.id}')"></button><button style="text-align:left;flex:1" onclick="edit('${x.id}')"><div class="list-title">${esc(x.task)}</div><div class="list-sub">${x.memo?esc(x.memo):" "}</div></button></div></div>`).join("")}</div>`;
}
function quickAdd(e,lane){
 if(e.target.closest(".event"))return;
 const r=lane.getBoundingClientRect(), y=e.clientY-r.top;
 let m=START_H*60+Math.round((y/SLOT*60)/30)*30; m=Math.min(END_H*60-30,Math.max(START_H*60,m));
 openAdd(`${pad(Math.floor(m/60))}:${pad(m%60)}`,`${pad(Math.floor((m+60)/60))}:${pad((m+60)%60)}`);
}
function openAdd(s="09:00",e="10:00"){
 $("editId").value="";$("task").value="";$("start").value=s;$("end").value=e;$("memo").value="";chooseColor(document.querySelector(".color[data-color='c0']"));$("formTitle").textContent="일정 추가";$("deleteBtn").style.display="none";$("sheet").classList.add("show");
}
function edit(id){let x=items().find(i=>i.id===id);if(!x)return;$("editId").value=id;$("task").value=x.task;$("start").value=x.start;$("end").value=x.end;$("memo").value=x.memo||"";chooseColor(document.querySelector(`.color[data-color="${x.color||"c0"}"]`));$("formTitle").textContent="일정 수정";$("deleteBtn").style.display="block";$("sheet").classList.add("show")}
function chooseColor(el){document.querySelectorAll(".color").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");chosenColor=el.dataset.color}
function saveItem(){
 if(!$("task").value.trim())return alert("일정을 입력해주세요.");
 if(mins($("end").value)<=mins($("start").value))return alert("종료 시간은 시작 시간보다 늦어야 합니다.");
 let arr=items(),id=$("editId").value;
 if(id){let x=arr.find(i=>i.id===id);Object.assign(x,{task:$("task").value.trim(),start:$("start").value,end:$("end").value,memo:$("memo").value.trim(),color:chosenColor})}
 else arr.push({id:Date.now().toString(),task:$("task").value.trim(),start:$("start").value,end:$("end").value,memo:$("memo").value.trim(),color:chosenColor,done:false});
 data[dateKey(selected)]=arr;save();closeSheet();render();
}
function toggle(id){let x=items().find(i=>i.id===id);if(x){x.done=!x.done;save();render()}}
function deleteEditing(){let id=$("editId").value;if(!id)return;if(confirm("이 일정을 삭제할까요?")){data[dateKey(selected)]=items().filter(x=>x.id!==id);save();closeSheet();render()}}
function closeSheet(){$("sheet").classList.remove("show")}
function goToday(){selected=new Date();selected.setHours(0,0,0,0);render()}
function setView(v){view=v;render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
setInterval(()=>{if(dateKey(selected)===dateKey(new Date()))render()},60000);
</script>
</body>
</html>
