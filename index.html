<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f6f6"><link rel="manifest" href="./manifest.json"><title>myDay</title><link rel="stylesheet" href="./style.css"></head>
<body><header><button id="previous" aria-label="이전 날짜">‹</button><button id="date-label"></button><input id="date" type="date" aria-label="날짜 선택"><button id="next" aria-label="다음 날짜">›</button><button id="today">오늘</button><button id="backup" aria-label="일정 백업">↓</button></header>
<main><section class="plan" aria-label="하루 시간표"><div class="plan-title">PLAN<button id="add-event" aria-label="일정 추가">＋</button></div><div class="ruler"><div></div><div class="minute-labels"><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>60</span></div></div><div id="timeline"></div></section><section class="study"><nav><button class="selected" id="study-tab">▤ 할 일</button><button id="schedule-tab">▦ 시간표만</button><button id="new-group" aria-label="분류 추가">＋</button></nav><div id="groups"></div><button class="add-group" id="group-add">＋ 분류 추가</button></section>
</main>
<dialog id="editor"><form id="form"><div class="dialog-head"><h2 id="editor-title">할 일 추가</h2><button type="button" id="cancel" aria-label="닫기">×</button></div><label>할 일<input id="task" required maxlength="100" placeholder="할 일을 입력하세요"></label><label>분류<select id="category"></select></label><label class="inline"><input type="checkbox" id="scheduled"> 시간표에 표시</label><div class="time-fields"><label>시작<input type="time" id="start" value="15:00"></label><label>종료<input type="time" id="end" value="16:00"></label></div><label>메모<textarea id="memo" rows="2"></textarea></label><label>색상<select id="color"><option value="blue">하늘색</option><option value="yellow">연노랑</option><option value="green">민트</option><option value="orange">살구</option><option value="purple">연보라</option><option value="pink">연분홍</option></select></label><label class="inline"><input type="checkbox" id="done"> 완료</label><p id="error" role="alert"></p><button class="save" type="submit">저장</button><button id="delete" type="button">삭제</button></form></dialog>
<dialog id="group-editor"><form id="group-form"><div class="dialog-head"><h2>분류 추가</h2><button type="button" id="group-cancel" aria-label="닫기">×</button></div><label>분류 이름<input id="group-name" required maxlength="30" placeholder="예: 운동, 업무, 집안일"></label><label>색상<select id="group-color"><option value="blue">하늘색</option><option value="yellow">연노랑</option><option value="green">민트</option><option value="purple">연보라</option><option value="pink">연분홍</option><option value="orange">살구</option></select></label><button class="save">추가</button></form></dialog><p id="status" role="status"></p><script src="./app.js"></script></body></html>
